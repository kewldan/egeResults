[project]
name = "egeresults"
version = "0.1.0"
description = "Telegram-бот, который отслеживает появление результатов ЕГЭ на ege.spb.ru и уведомляет подписчиков"
requires-python = ">=3.11"
dependencies = [
    "aiogram~=3.30.0",
    "beanie~=2.2.0",
    "pymongo~=4.17.0",
    "pydantic~=2.13.4",
    "pydantic-settings~=2.15.0",
    "apscheduler~=3.11.3",
    "httpx~=0.28.1",
    "cryptography~=50.0.0",
    "beautifulsoup4~=4.15.0",
    "redis~=7.4.1",
]

[project.scripts]
ege-notifier = "ege_notifier.__main__:run"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ege_notifier"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
